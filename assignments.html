<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - DeadlineDASH</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <header class="app-header">
            <div class="header-left">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <i class="fas fa-rocket"></i>
                    <span>DeadlineDASH</span>
                </div>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <span id="headerUserName">Welcome!</span>
                    <div class="user-menu">
                        <button class="user-avatar" onclick="toggleUserMenu()">
                            <i class="fas fa-user"></i>
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="profile.html">Profile</a>
                            <a href="settings.html">Settings</a>
                            <a href="#" onclick="logout()">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="app-container">
            <aside class="sidebar" id="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="assignments.html" class="nav-item active">
                        <i class="fas fa-tasks"></i>
                        <span>Assignments</span>
                    </a>
                    <a href="courses.html" class="nav-item">
                        <i class="fas fa-book"></i>
                        <span>Courses</span>
                    </a>
                    <a href="calendar.html" class="nav-item">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Calendar</span>
                    </a>
                    <a href="statistics.html" class="nav-item">
                        <i class="fas fa-chart-pie"></i>
                        <span>Statistics</span>
                    </a>
                    <a href="profile.html" class="nav-item">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                    <a href="settings.html" class="nav-item">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </nav>
            </aside>

            <main class="main-content">
                <div class="page-header">
                    <div>
                        <h1>Assignments</h1>
                    </div>
                    <button class="btn-primary" onclick="showModal('assignmentModal')">
                        <i class="fas fa-plus"></i> Add Assignment
                    </button>
                </div>

                <div class="content-wrapper">
                    <div class="filters">
                        <select id="courseFilter" onchange="filterAssignments()">
                            <option value="">All Courses</option>
                        </select>
                        <select id="statusFilter" onchange="filterAssignments()">
                            <option value="">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                        <select id="priorityFilter" onchange="filterAssignments()">
                            <option value="">All Priorities</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <div class="assignments-grid" id="assignmentsGrid">
                        <p class="empty-state">No assignments found. Add your first assignment!</p>
                    </div>
                </div>
            </main>
        </div>
        
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    </div>

    <!-- Assignment Modal -->
    <div id="assignmentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="assignmentModalTitle">Add Assignment</h2>
                <button class="close-btn" onclick="closeModal('assignmentModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="assignmentForm" class="modal-form">
                <input type="hidden" id="assignmentId">
                <div class="form-group">
                    <label for="assignmentTitle">Title</label>
                    <input type="text" id="assignmentTitle" required>
                </div>
                <div class="form-group">
                    <label for="assignmentType">Type</label>
                    <select id="assignmentType" required>
                        <option value="">Select Type</option>
                        <option value="homework">Homework</option>
                        <option value="project">Project</option>
                        <option value="quiz">Quiz</option>
                        <option value="exam">Exam</option>
                        <option value="presentation">Presentation</option>
                        <option value="lab">Lab Work</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignmentCourse">Course</label>
                    <select id="assignmentCourse" required>
                        <option value="">Select Course</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignmentDueDate">Due Date</label>
                    <input type="datetime-local" id="assignmentDueDate" required>
                </div>
                <div class="form-group">
                    <label for="assignmentPriority">Priority</label>
                    <select id="assignmentPriority" required>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignmentStatus">Status</label>
                    <select id="assignmentStatus" required>
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignmentDescription">Description (Optional)</label>
                    <textarea id="assignmentDescription" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('assignmentModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Assignment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/assignments.js"></script>
</body>
</html>
