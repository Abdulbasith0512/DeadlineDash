<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DeadlineDASH</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-rocket"></i>
                    <span>DeadlineDASH</span>
                </div>
                <h1>Forgot Password</h1>
                <p>Enter your phone number to reset your password</p>
                <a href="login.html" class="back-link" style="color: var(--accent-color); text-decoration: none; font-size: 0.875rem;">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>

            <!-- Step 1: Phone Number Input -->
            <form id="phoneForm" class="auth-form flex flex-column gap-md">
                <div class="form-group">
                    <label for="resetPhone">Phone Number</label>
                    <input type="tel" id="resetPhone" placeholder="+919010197771" value="+919010197771" required />
                    <small style="color: #666; font-size: 0.8rem;">Enter your registered phone number</small>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i>
                    Send Reset Code
                </button>
            </form>

            <!-- Step 2: OTP Verification -->
            <form id="otpForm" class="auth-form flex flex-column gap-md" style="display: none;">
                <div class="form-group">
                    <label>Enter 6-digit code sent to your phone</label>
                    <div class="otp-container">
                        <input type="text" class="otp-input" maxlength="1" required />
                        <input type="text" class="otp-input" maxlength="1" required />
                        <input type="text" class="otp-input" maxlength="1" required />
                        <input type="text" class="otp-input" maxlength="1" required />
                        <input type="text" class="otp-input" maxlength="1" required />
                        <input type="text" class="otp-input" maxlength="1" required />
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i>
                    Verify Code
                </button>
            </form>

            <!-- Step 3: New Password -->
            <form id="passwordForm" class="auth-form flex flex-column gap-md" style="display: none;">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required />
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" required />
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-key"></i>
                    Reset Password
                </button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
