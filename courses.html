<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - DeadlineDASH</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <header class="app-header">
            <div class="header-left">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <i class="fas fa-rocket"></i>
                    <span>DeadlineDASH</span>
                </div>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <span id="headerUserName">Welcome!</span>
                    <div class="user-menu">
                        <button class="user-avatar" onclick="toggleUserMenu()">
                            <i class="fas fa-user"></i>
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="profile.html">Profile</a>
                            <a href="settings.html">Settings</a>
                            <a href="#" onclick="logout()">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="app-container">
            <aside class="sidebar" id="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="assignments.html" class="nav-item">
                        <i class="fas fa-tasks"></i>
                        <span>Assignments</span>
                    </a>
                    <a href="courses.html" class="nav-item active">
                        <i class="fas fa-book"></i>
                        <span>Courses</span>
                    </a>
                    <a href="calendar.html" class="nav-item">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Calendar</span>
                    </a>
                    <a href="statistics.html" class="nav-item">
                        <i class="fas fa-chart-pie"></i>
                        <span>Statistics</span>
                    </a>
                    <a href="profile.html" class="nav-item">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                    <a href="settings.html" class="nav-item">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </nav>
            </aside>

            <main class="main-content">
                <div class="page-header">
                    <div>
                        <h1>Courses</h1>
                    </div>
                    <button class="btn-primary" onclick="showModal('courseModal')">
                        <i class="fas fa-plus"></i> Add Course
                    </button>
                </div>

                <div class="content-wrapper">
                    <div class="courses-grid" id="coursesGrid">
                        <p class="empty-state">No courses found. Add your first course!</p>
                    </div>
                </div>
            </main>
        </div>

        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    </div>

    <!-- Course Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="courseModalTitle">Add Course</h2>
                <button class="close-btn" onclick="closeModal('courseModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="courseForm" class="modal-form">
                <input type="hidden" id="courseId">
                <div class="form-group">
                    <label for="courseName">Course Name</label>
                    <input type="text" id="courseName" required>
                </div>
                <div class="form-group">
                    <label for="courseCode">Course Code</label>
                    <input type="text" id="courseCode" required>
                </div>
                <div class="form-group">
                    <label for="courseSemester">Semester</label>
                    <select id="courseSemester" required>
                        <option value="">Select Semester</option>
                        <option value="fall">Fall</option>
                        <option value="spring">Spring</option>
                        <option value="summer">Summer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="courseColor">Course Color</label>
                    <div class="color-picker">
                        <input type="color" id="courseColor" value="#00D2D3">
                        <div class="color-presets">
                            <div class="color-option" style="background: #00D2D3" onclick="setColor('#00D2D3')"></div>
                            <div class="color-option" style="background: #2ED573" onclick="setColor('#2ED573')"></div>
                            <div class="color-option" style="background: #FF4757" onclick="setColor('#FF4757')"></div>
                            <div class="color-option" style="background: #2C3E50" onclick="setColor('#2C3E50')"></div>
                            <div class="color-option" style="background: #9B59B6" onclick="setColor('#9B59B6')"></div>
                            <div class="color-option" style="background: #F39C12" onclick="setColor('#F39C12')"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('courseModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <!-- File Upload Modal -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Upload Course Materials</h2>
                <button class="close-btn" onclick="closeModal('fileModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="uploadCourseId">
                <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Click to upload files or drag and drop</p>
                    <small>PDF, DOC, PPT, TXT files up to 10MB</small>
                </div>
                <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.txt" style="display: none;" onchange="handleFileUpload(event)">
                <div id="uploadedFiles" class="uploaded-files"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeModal('fileModal')">Close</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/courses.js"></script>
</body>
</html>
