<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar - DeadlineDASH</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <button class="sidebar-toggle" onclick="toggleSidebar()">
          <i class="fas fa-bars"></i>
        </button>
        <div class="logo">
          <i class="fas fa-rocket"></i>
          <span>DeadlineDASH</span>
        </div>
      </div>
      <div class="header-right">
        <div class="user-info">
          <span id="headerUserName">Welcome!</span>
          <div class="user-menu">
            <button class="user-avatar" onclick="toggleUserMenu()">
              <i class="fas fa-user"></i>
            </button>
            <div class="user-dropdown" id="userDropdown">
              <a href="profile.html">Profile</a>
              <a href="settings.html">Settings</a>
              <a href="#" onclick="logout()">Logout</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
          <a href="assignments.html" class="nav-item"><i class="fas fa-tasks"></i><span>Assignments</span></a>
          <a href="courses.html" class="nav-item"><i class="fas fa-book"></i><span>Courses</span></a>
          <a href="calendar.html" class="nav-item active"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
          <a href="statistics.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Statistics</span></a>
          <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
          <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <div class="content-wrapper">
          <!-- Calendar Navigation Tabs -->
          <div class="calendar-nav-tabs">
            <button class="nav-tab" onclick="switchCalendarView('list')" id="listViewBtn">
              <i class="fas fa-list"></i> List View
            </button>
            <button class="nav-tab active" onclick="switchCalendarView('month')" id="monthViewBtn">
              <i class="fas fa-calendar"></i> Calendar
            </button>
            <button class="nav-tab" onclick="window.location.href='statistics.html'">
              <i class="fas fa-chart-bar"></i> Statistics
            </button>
          </div>

          <!-- Month View -->
          <div id="monthView" class="calendar-view active">
            <!-- Calendar Header with Month/Year and Navigation -->
            <div class="calendar-main-header">
              <h1 id="currentMonth">July 2025</h1>
              <div class="calendar-nav-controls">
                <button class="nav-btn" onclick="previousMonth()" aria-label="Previous Month">
                  <i class="fas fa-chevron-left"></i>
                </button>
                <button class="nav-btn today-btn" id="todayBtn" onclick="goToToday()">Today</button>
                <button class="nav-btn" onclick="nextMonth()" aria-label="Next Month">
                  <i class="fas fa-chevron-right"></i>
                </button>
              </div>
            </div>

            <!-- Calendar Grid -->
            <div class="calendar-container">
              <div class="calendar-grid" id="calendarGrid">
                <!-- Calendar will be generated here -->
              </div>
            </div>
          </div>

          <!-- List View -->
          <div id="listView" class="calendar-view">
            <div class="list-view-container">
              <h2>Upcoming Assignments</h2>
              <div class="calendar-list" id="calendarList">
                <!-- Assignment list will be populated here -->
                <p class="empty-state">No events available in this view.</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  </div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
